name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build logon-doctor.exe (MinGW cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MinGW and the Windows Rust target
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu

      # Cargo.toml is the single source of truth for the version. A release tag has to
      # match it exactly, so the tag, the release and `--version` can never disagree.
      - name: Work out version string
        id: ver
        run: |
          cargo_ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_ver="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag_ver" != "$cargo_ver" ]]; then
              echo "::error::Tag v$tag_ver does not match Cargo.toml version $cargo_ver. Bump Cargo.toml first, or tag v$cargo_ver."
              exit 1
            fi
            echo "version=$cargo_ver" >> "$GITHUB_OUTPUT"
          else
            echo "version=$cargo_ver-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # .cargo/config.toml already selects the x86_64-pc-windows-gnu target and linker.
      - name: Build
        env:
          LOGON_DOCTOR_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cargo build --release --locked
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/logon-doctor.exe dist/
          (cd dist && sha256sum *.exe > SHA256SUMS.txt)
          ls -la dist

      # The release text is the CHANGELOG.md section for this version. This runs on every
      # build, so bumping Cargo.toml without writing the notes fails in the pull request,
      # long before anyone tries to tag.
      - name: Extract release notes from CHANGELOG.md
        run: |
          cargo_ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          scripts/release-notes.sh "$cargo_ver" > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: logon-doctor-windows
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: logon-doctor-windows
          path: dist

      - name: Create release and attach binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/logon-doctor.exe
            dist/SHA256SUMS.txt
          body_path: dist/RELEASE_NOTES.md
          # Appends GitHub's own list of merged pull requests under our notes.
          generate_release_notes: true
